apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: examen-frontend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Mahdihemdane/devops-exam.git'
    targetRevision: HEAD
    path: k8s/frontend
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: examen-26
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
