name: release-approve

on:
  pull_request:
    branches: [ main ]
    types: [ closed ]

jobs:
  promote-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote Docker image
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/chuzone-poc:1.0.0-RC1
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/chuzone-poc:1.0.0-RC1 ${{ secrets.DOCKERHUB_USERNAME }}/chuzone-poc:1.0.0
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/chuzone-poc:1.0.0

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v1.0.0
          git push origin v1.0.0
